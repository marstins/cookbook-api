services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      AUTH_KEY: ${AUTH_KEY:-}
    volumes:
      - api-data:/app/instance

  front:
    build: ../cookbook-front
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  api-data:
